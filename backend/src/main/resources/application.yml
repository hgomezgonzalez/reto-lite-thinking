server:
  port: ${PORT:8080}

spring:
  application:
    name: reto-backend

  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/reto_db}
    username: ${JDBC_DATABASE_USERNAME:reto_user}
    password: ${JDBC_DATABASE_PASSWORD:reto_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:reto_lite}
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:reto_lite}
    default-schema: ${DB_SCHEMA:reto_lite}
    create-schemas: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_TLS:false}

# Configuracion propia de la aplicacion
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:9000,http://localhost:9200}
  jwt:
    # Clave base64 de 256 bits. En produccion SIEMPRE sobrescribir con env JWT_SECRET.
    secret: ${JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZW1vLXNlY3JldC1rZXktMjU2LWJpdHMtbG9uZw==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  mail:
    from: ${SMTP_FROM:no-reply@litethinking.local}
  currency:
    # Moneda en la que se almacenan los precios base de los productos
    base: ${CURRENCY_BASE:COP}
    # Monedas en las que se exponen las conversiones
    targets: ${CURRENCY_TARGETS:COP,USD,EUR}
    # API REST publica de tasas de cambio (con fallback a tasas estaticas)
    api-url: ${CURRENCY_API_URL:https://open.er-api.com/v6/latest}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
