name: Deploy a Heroku

# Despliega el monorepo a Heroku desde GitHub en cada push a main:
#  - backend/  -> app reto-lite-api  (buildpack Java)
#  - frontend/ -> app reto-lite-web  (buildpack Node.js)
# Usa git puro (subtree split + push al git de Heroku con el API key),
# sin depender del CLI de Heroku. Requiere el secret HEROKU_API_KEY.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Backend (reto-lite-api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy backend a Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          SHA=$(git subtree split --prefix backend HEAD)
          git push --force "https://heroku:${HEROKU_API_KEY}@git.heroku.com/reto-lite-api.git" "${SHA}:refs/heads/main"

  deploy-frontend:
    name: Frontend (reto-lite-web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy frontend a Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          SHA=$(git subtree split --prefix frontend HEAD)
          git push --force "https://heroku:${HEROKU_API_KEY}@git.heroku.com/reto-lite-web.git" "${SHA}:refs/heads/main"
